<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Twitch Трибуна — Pixel Head v2</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    image-rendering: pixelated;
  }

  #stadium {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 470px;
    overflow: hidden;
  }
  #stadiumSvg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #stage {
    position: absolute;
    inset: 0;
  }

  /* ===== Слой конфети ===== */
  #confettiLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }
  .confetti {
    position: absolute;
    top: -20px;
    width: 8px;
    height: 14px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
  }

  /* ===== Человечек ===== */
  .person {
    position: absolute;
    width: 32px;
    height: 72px;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 0.45s ease, left 1.8s cubic-bezier(.22,.7,.25,1);
    will-change: left, opacity;
  }
  .person.alive { opacity: 1; }
  .person.entering { left: -45px !important; opacity: 0; }
  .person.walking { animation: walkBody 0.28s steps(2, end) infinite; }
  .person.dying { opacity: 0; left: -55px !important; transition: opacity 0.35s ease, left 1.1s ease-in; }
  @keyframes walkBody { 0%, 100% { margin-top: 0; } 50% { margin-top: -2px; } }

  /* Обёртка для прыжков (translateY) */
  .person-bounce {
    position: absolute;
    inset: 0;
  }
  .person-bounce.jumping {
    animation: jumpOnce 0.8s ease-out;
  }
  .person-bounce.celebrating {
    animation: jumpThree 1.8s ease-in-out;
  }
  @keyframes jumpOnce {
    0%   { transform: translateY(0); }
    40%  { transform: translateY(-22px); }
    70%  { transform: translateY(0); }
    85%  { transform: translateY(-6px); }
    100% { transform: translateY(0); }
  }
  @keyframes jumpThree {
    0%   { transform: translateY(0); }
    12%  { transform: translateY(-22px); }
    24%  { transform: translateY(0); }
    36%  { transform: translateY(-22px); }
    48%  { transform: translateY(0); }
    60%  { transform: translateY(-22px); }
    72%  { transform: translateY(0); }
    100% { transform: translateY(0); }
  }

  /* Обёртка для покачивания (rotate) */
  .person-inner {
    position: absolute;
    inset: 0;
    transform-origin: bottom center;
    animation: sway 3s ease-in-out infinite;
    animation-delay: var(--sway-delay, 0s);
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.5deg); }
    50%      { transform: rotate(1.5deg); }
  }
  /* Во время прыжка покачивание отключаем */
  .person-bounce.jumping .person-inner,
  .person-bounce.celebrating .person-inner {
    animation: none;
    transform: rotate(0);
  }

  .person .head,
  .person .body,
  .person .arm-left,
  .person .arm-right,
  .person .leg-left,
  .person .leg-right {
    position: absolute;
    background: var(--c);
    transition: transform 0.2s ease;
  }
  .person .head {
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 16px; height: 16px;
    border-radius: 2px;
    border: 2px solid #11131a;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.35);
  }
  .person .body {
    top: 16px; left: 50%;
    transform: translateX(-50%);
    width: 6px; height: 24px;
    border: 2px solid #11131a;
  }
  .person .arm-left, .person .arm-right {
    top: 22px;
    width: 4px; height: 18px;
    border: 1px solid #11131a;
  }
  .person .arm-left  { left: 50%; transform: translateX(-50%) rotate(35deg);  transform-origin: top; }
  .person .arm-right { left: 50%; transform: translateX(-50%) rotate(-35deg); transform-origin: top; }
  .person .leg-left, .person .leg-right {
    top: 42px;
    width: 4px; height: 22px;
    border: 1px solid #11131a;
  }
  .person .leg-left  { left: 50%; transform: translateX(-50%) rotate(15deg);  transform-origin: top; }
  .person .leg-right { left: 50%; transform: translateX(-50%) rotate(-15deg); transform-origin: top; }

  /* Руки вверх во время прыжка/празднования */
  .person-bounce.jumping .arm-left,
  .person-bounce.celebrating .arm-left {
    transform: translateX(-50%) rotate(130deg);
  }
  .person-bounce.jumping .arm-right,
  .person-bounce.celebrating .arm-right {
    transform: translateX(-50%) rotate(-130deg);
  }

  .person .nick {
    position: absolute;
    top: -20px; left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 12px;
    color: #fff;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
  }

  /* ===== Пузырь сообщения ===== */
  .person .msg {
    position: absolute;
    top: 0; left: 36px;
    max-width: 200px;
    padding: 5px 10px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-size: 12px;
    border-radius: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    z-index: 10;
  }
  .person .msg::after {
    content: '';
    position: absolute;
    left: -5px;
    top: 50%;
    transform: translateY(-50%);
    width: 0; height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-right: 6px solid rgba(0,0,0,0.8);
  }
  .person .msg.show { opacity: 1; }

  /* ===== Pixel-art прототип ===== */
  .person .head, .person .body, .person .arm-left, .person .arm-right,
  .person .leg-left, .person .leg-right {
    border-radius: 0;
    image-rendering: pixelated;
  }
  .person .nick {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    letter-spacing: -0.5px;
    text-shadow: 1px 1px 0 #000;
  }

  /* ===== Pixel-art refined: цельный силуэт ===== */
  .person .head {
    width: 18px; height: 17px;
    border: 2px solid #11131a;
    border-radius: 0;
    clip-path: polygon(18% 0, 82% 0, 100% 18%, 100% 82%, 82% 100%, 18% 100%, 0 82%, 0 18%);
    z-index: 3;
  }
  .person .body {
    width: 8px; height: 25px;
    border: 2px solid #11131a;
    z-index: 2;
  }
  .person .arm-left, .person .arm-right,
  .person .leg-left, .person .leg-right {
    border: 0;
    box-shadow: none;
    z-index: 1;
  }
  .person .arm-left, .person .arm-right { width: 3px; height: 18px; }
  .person .leg-left, .person .leg-right { width: 3px; height: 22px; }
  .person .leg-left  { transform: translateX(-50%) rotate(12deg); }
  .person .leg-right { transform: translateX(-50%) rotate(-12deg); }

  /* ===== Pixel head v2: мягкий ступенчатый силуэт ===== */
  .person .head {
    top: -1px;
    width: 20px; height: 19px;
    background: transparent;
    border: 0;
    border-radius: 0;
    clip-path: none;
    box-shadow: none;
    z-index: 3;
  }
  .person .head::before, .person .head::after {
    content: '';
    position: absolute;
    display: block;
    clip-path: polygon(20% 0, 80% 0, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0 80%, 0 20%);
  }
  .person .head::before {
    inset: 0;
    background: #11131a;
  }
  .person .head::after {
    inset: 2px;
    background: var(--c);
  }

  /* ===== Персонаж: плечи, ладони, ступни и варианты одежды ===== */
  .person .head, .person .arm-left, .person .arm-right,
  .person .leg-left, .person .leg-right,
  .person .hand-left, .person .hand-right,
  .person .foot-left, .person .foot-right { background: var(--skin); }
  .person .body {
    top: 15px; width: 9px; height: 25px;
    background: var(--shirt);
    border: 1px solid #11131a;
  }
  .person .arm-left, .person .arm-right {
    top: 17px; width: 3px; height: 19px;
    border: 0;
  }
  .person .arm-left { transform: translateX(-50%) rotate(28deg); }
  .person .arm-right { transform: translateX(-50%) rotate(-28deg); }
  .person .leg-left, .person .leg-right {
    top: 39px; width: 3px; height: 23px; border: 0;
  }
  .person .hand-left, .person .hand-right,
  .person .foot-left, .person .foot-right {
    position: absolute; display: block; z-index: 2;
    width: 5px; height: 5px; background: var(--skin);
  }
  .person .hand-left { left: 5px; top: 32px; }
  .person .hand-right { right: 5px; top: 32px; }
  .person .foot-left { left: 7px; top: 60px; }
  .person .foot-right { right: 7px; top: 60px; }
  .person .hand-left, .person .hand-right,
  .person .foot-left, .person .foot-right {
    clip-path: polygon(0 20%, 80% 20%, 100% 50%, 80% 80%, 0 80%);
  }

  /* ===== Лицо, одежда и соединённые конечности ===== */
  .person .head::before { inset: 0; }
  .person .head::after { inset: 2px; }
  .person .eye-left, .person .eye-right {
    position: absolute; z-index: 5; top: 7px;
    width: 2px; height: 2px; background: #17131a;
  }
  .person .eye-left { left: 5px; }
  .person .eye-right { right: 5px; }
  .person .mouth {
    position: absolute; z-index: 5; left: 50%; top: 12px;
    width: 5px; height: 2px; background: #5b2630;
    transform: translateX(-50%);
  }
  .person .ear-left, .person .ear-right {
    position: absolute; z-index: 1; top: 8px;
    width: 3px; height: 5px; background: var(--skin);
  }
  .person .ear-left { left: -2px; }
  .person .ear-right { right: -2px; }
  .person .arm-left, .person .arm-right { overflow: visible; }
  .person .hand-left, .person .hand-right {
    position: absolute; top: 15px; width: 5px; height: 5px;
    background: var(--skin); z-index: 3;
  }
  .person .arm-left .hand-left { left: -2px; }
  .person .arm-right .hand-right { right: -2px; }
  .person .pants {
    position: absolute; z-index: 2; left: 50%; top: 37px;
    width: 11px; height: 9px; transform: translateX(-50%);
    background: var(--pants); border: 1px solid #11131a;
  }
  .person .foot-left, .person .foot-right { background: var(--shoe); }

  /* ===== Голова: цельная форма без лишних выступов ===== */
  .person .head {
    top: 0; width: 19px; height: 18px;
    background: var(--skin);
    border: 1px solid #17131a;
    clip-path: polygon(17% 0, 83% 0, 100% 17%, 100% 83%, 83% 100%, 17% 100%, 0 83%, 0 17%);
    box-shadow: none;
  }
  .person .head::before, .person .head::after { display: none; }
  .person .ear-left, .person .ear-right {
    top: 7px; width: 3px; height: 4px;
    background: var(--skin); z-index: -1;
  }

  /* ===== Общее футбольное табло ===== */
  #messageBoard {
    position: absolute; z-index: 20;
    left: 50%; top: 78px; transform: translateX(-50%);
    width: min(360px, calc(100% - 28px)); height: 30px;
    box-sizing: border-box; overflow: hidden;
    background: #111923; border: 2px solid #596879;
    box-shadow: 0 3px 0 #080b10, inset 0 0 0 1px #202b38;
    color: #f3f1d0; font-family: 'Courier New', monospace;
    font-size: 12px; line-height: 26px; white-space: nowrap;
  }
  #messageBoard .board-label {
    display: inline-block; width: 78px; box-sizing: border-box; text-align: center; padding: 0 5px; color: #f2c94c;
    border-right: 1px solid #596879; font-weight: 700;
  }
  #boardViewport { display: inline-block; max-width: calc(100% - 82px); overflow: hidden; vertical-align: top; }
  #boardText { display: inline-block; padding-left: 8px; }
  #boardText.scrolling { animation: boardTicker 8s linear infinite; }
  @keyframes boardTicker { 0%, 12% { transform: translateX(0); } 88%, 100% { transform: translateX(var(--ticker-distance)); } }
  .person .msg { display: none; }

  /* ===== Быстрые темы для сравнения ===== */
  body.theme-retro #messageBoard { background: #172536; border-color: #d6a83e; box-shadow: 0 3px 0 #080b10, inset 0 0 0 1px #f0ce67; }
  body.theme-retro #messageBoard .board-label { color: #f4d36e; border-color: #d6a83e; }
  body.theme-retro #stadiumSvg { filter: sepia(.2) saturate(1.25) hue-rotate(-8deg); }
  body.theme-night #messageBoard { background: #111a2b; border-color: #38bdf8; box-shadow: 0 3px 0 #070b16, inset 0 0 0 1px #b54cff; }
  body.theme-night #messageBoard .board-label { color: #62e7ff; border-color: #347ca8; }
  body.theme-night #stadiumSvg { filter: saturate(.8) hue-rotate(12deg) brightness(.9); }

  /* ===== Вечернее табло и читаемые ники ===== */
  #messageBoard { top: 135px; height: 34px; border: 2px solid #4eb7d0; background: #0b1725; box-shadow: 0 4px 0 #050912, inset 0 0 0 1px #8eeaff; }
  #messageBoard::before, #messageBoard::after { content:''; position:absolute; top:100%; width:8px; height:24px; background:#273746; border:1px solid #4f7280; z-index:-1; }
  #messageBoard::before { left:42px; } #messageBoard::after { right:42px; }
  #messageBoard .board-label { width:86px; line-height:30px; color:#8eeaff; border-color:#397b91; text-shadow:1px 1px #07121c; }
  #boardViewport { line-height:30px; max-width:calc(100% - 92px); }
  .person .nick { top:-24px; padding:2px 4px; background:rgba(5,12,20,.82); border:1px solid rgba(100,170,190,.7); color:#e7fbff; font-size:13px; line-height:14px; text-shadow:1px 1px #000; }
  .cloud-pixel { animation: cloudDrift 28s linear infinite; }
  .flag-pixel { transform-box: fill-box; transform-origin: left center; animation: flagWave 1.8s ease-in-out infinite; }
  @keyframes cloudDrift { from { transform:translateX(-18px); } to { transform:translateX(18px); } }
  @keyframes flagWave { 0%,100% { transform:skewY(0deg); } 50% { transform:skewY(5deg); } }

  /* ===== Табло в стиле футбольного LED-экрана ===== */
  #messageBoard {
    top: 205px; width: min(580px, calc(100% - 24px)); height: 52px;
    padding: 5px; display:flex; align-items:stretch; gap:5px;
    background:#25282c; border:3px solid #0e1013; border-radius:10px;
    box-shadow: 0 0 0 2px #d9dde0, 0 0 0 5px #11151a, 0 5px 0 #080a0c;
    line-height:38px; font-family:'Courier New', monospace;
  }
  #messageBoard::before, #messageBoard::after {
    top:calc(100% + 3px); width:14px; height:32px; z-index:0;
    background:linear-gradient(90deg,#202327,#9da3a8 48%,#24272b 60%,#101214);
    border:0; box-shadow:0 2px 0 #080a0c;
  }
  #messageBoard::before { left:54px; } #messageBoard::after { right:54px; }
  #messageBoard .board-label {
    flex:0 0 105px; width:auto; height:36px; box-sizing:border-box; padding:0 6px; overflow:hidden;
    color:#ff5757; background:#151719; border:2px solid #111;
    box-shadow:inset 0 0 0 1px #4b4f53;
    font-size:13px; line-height:38px; text-align:center; text-overflow:ellipsis;
    text-shadow:0 0 3px #ff3030, 1px 1px #000;
  }
  #boardViewport { flex:1; max-width:none; height:36px; box-sizing:border-box; background:#151719; border:2px solid #111; box-shadow:inset 0 0 0 1px #4b4f53; line-height:36px; }
  #boardText { color:#ff5757; padding-left:12px; font-size:13px; letter-spacing:1px; text-shadow:0 0 3px #ff3030, 1px 1px #000; }
  #boardText.scrolling { animation-duration:9s; }

  /* ===== Dev-панель ===== */
  #devPanel {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(0,0,0,0.85);
    color: #0f0;
    font-family: monospace;
    font-size: 11px;
    padding: 8px 10px;
    border-radius: 6px;
    z-index: 999;
    display: none;
    max-width: 320px;
  }
  #devPanel.on { display: block; }
  #devPanel button {
    background: #222; color: #0f0;
    border: 1px solid #0f0;
    padding: 3px 6px; margin: 2px;
    cursor: pointer; font-family: monospace; font-size: 11px;
  }
  #devPanel button:hover { background: #0f0; color: #000; }
  #devLog {
    margin-top: 6px;
    max-height: 120px;
    overflow-y: auto;
    border-top: 1px solid #333;
    padding-top: 4px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<div id="messageBoard"><span id="boardNick" class="board-label">—</span><span id="boardViewport"><span id="boardText">Ожидание сообщений…</span></span></div>

<div id="stadium">
  <svg id="stadiumSvg"></svg>
  <div id="stage"></div>
</div>

<div id="confettiLayer"></div>

<div id="devPanel">
  <div><b>DEV MODE</b> <span id="devTime">×1</span></div>
  <div>
    <button onclick="devAddPerson()">+ Зритель</button>
    <button onclick="devSpam()">Спам</button>
    <button onclick="devCelebrate()">Праздник</button>
    <button onclick="devConfetti()">Конфети</button>
    <button onclick="devToggleTime()">Время ×10</button>
    <button onclick="devClear()">Очистить</button>
    <button onclick="devTheme('retro')">Ретро</button>
    <button onclick="devTheme('night')">Ночь</button>
  </div>
  <div id="devStats"></div>
  <div id="devLog"></div>
</div>

<script>
/* ============================ НАСТРОЙКИ ============================ */
const CONFIG = {
  channel: 'yarrch',
  keyword: 'трибуна',

  ttl: 30 * 1000,
  fadeOut: 1000,

  cols: 5,
  rows: 3,
  stadiumHeight: 470,
  rowYs: [70, 135, 200],

  msgDuration: 6000,
  antispamMs: 3000,
  queueMax: 3,

  maxPersons: 15,

  banners: ['telegram NONSTAZY', 'twitch NONSTAZY'],

  // Слова для празднования (прыжки)
  celebrateWords: ['ура', 'гол', 'победа'],
};

const PALETTE = {
  sky1: '#0a0a0c',
  sky2: '#16161a',
  tierFront: ['#28282e', '#22222a'],
  tierMid:   ['#22222a', '#1c1c22'],
  tierRear:  ['#1c1c22', '#141418'],
  seatFront: '#34343e',
  seatMid:   '#2c2c34',
  seatRear:  '#242429',
  seatStroke: 'rgba(0,0,0,0.35)',
  wallGradTop: '#3a3a42',
  wallGradBot: '#26262c',
  wallTop: '#4a4a52',
  billboard: '#1c1c22',
  billboardStroke: '#333',
  billboardText: '#666',
  flag: '#2a2a32',
  flagPole: '#3a3a44',
};

const ENV_THEMES = {
  light: { sky1:'#e89a55', sky2:'#f5c477', tierFront:['#47706d','#355655'], tierMid:['#527c78','#3e615f'], tierRear:['#668d83','#4f716b'], seatFront:'#6e9b84', seatMid:'#5d8876', seatRear:'#4f7669', seatStroke:'#263d3a', wallGradTop:'#718b7d', wallGradBot:'#405c56', wallTop:'#9bb09a', billboard:'#24484b', billboardStroke:'#d4b65d', billboardText:'#f5e7b2', flag:'#d55b43', flagPole:'#334c47' },
  night: { sky1:'#111827', sky2:'#263b55', tierFront:['#263743','#1b2934'], tierMid:['#304653','#243640'], tierRear:['#3d5660','#293d48'], seatFront:'#45636a', seatMid:'#3d5860', seatRear:'#304a53', seatStroke:'#111c27', wallGradTop:'#3d5260', wallGradBot:'#202d39', wallTop:'#607886', billboard:'#102331', billboardStroke:'#4eb7d0', billboardText:'#d6f5f5', flag:'#8e4d79', flagPole:'#7893a0' }
};
function applyEnvironmentTheme(name) {
  Object.assign(PALETTE, ENV_THEMES[name] || ENV_THEMES.light);
  document.body.dataset.environment = name;
  drawStadium();
  log(`Окружение: ${name}`);
}
/* =================================================================== */

const DEV = new URLSearchParams(location.search).get('dev') === '1';
let timeScale = 1;

const svgEl = document.getElementById('stadiumSvg');
const stageEl = document.getElementById('stage');
const confettiLayer = document.getElementById('confettiLayer');
const devPanel = document.getElementById('devPanel');
const devLogEl = document.getElementById('devLog');
const devStatsEl = document.getElementById('devStats');
const devTimeEl = document.getElementById('devTime');
const boardTextEl = document.getElementById('boardText');
const boardNickEl = document.getElementById('boardNick');
const boardQueue = [];
let boardBusy = false;
if (DEV) devPanel.classList.add('on');

const persons = new Map();
const slots = [];

Object.defineProperty(CONFIG, 'slotWidth', {
  get() {
    return Math.min(120, (window.innerWidth - 240) / CONFIG.cols);
  }
});

/* ============== СЛОТЫ ============== */
function computeSlots() {
  slots.length = 0;
  const W = window.innerWidth;
  const totalW = CONFIG.cols * CONFIG.slotWidth;
  const startX = (W - totalW) / 2 + CONFIG.slotWidth / 2;

  for (let r = 0; r < CONFIG.rows; r++) {
    const y = CONFIG.rowYs[r];
    const shift = (r % 2 === 0) ? 0 : CONFIG.slotWidth / 2;

    for (let c = 0; c < CONFIG.cols; c++) {
      const x = startX + c * CONFIG.slotWidth + shift;
      slots.push({ x, y, taken: null, row: r, col: c });
    }
  }
}

/* ============== РИСОВАНИЕ ============== */
function drawStadium() {
  const W = window.innerWidth;
  const H = CONFIG.stadiumHeight;
  svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svgEl.setAttribute('preserveAspectRatio', 'none');
  svgEl.innerHTML = '';

  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };
  const grad = (id, stops, x2 = '0', y2 = '1') => {
    const g = el('linearGradient', { id, x1: '0', y1: '0', x2, y2 });
    for (const s of stops) g.append(el('stop', { offset: s[0], 'stop-color': s[1] }));
    return g;
  };

  const defs = el('defs');
  defs.append(grad('skyGrad', [['0%', PALETTE.sky1], ['100%', PALETTE.sky2]]));
  defs.append(grad('tierFront', [['0%', PALETTE.tierFront[0]], ['100%', PALETTE.tierFront[1]]]));
  defs.append(grad('tierMid',   [['0%', PALETTE.tierMid[0]],   ['100%', PALETTE.tierMid[1]]]));
  defs.append(grad('tierRear',  [['0%', PALETTE.tierRear[0]],  ['100%', PALETTE.tierRear[1]]]));
  defs.append(grad('wallGrad',  [['0%', PALETTE.wallGradTop],  ['100%', PALETTE.wallGradBot]]));

  const glow = el('radialGradient', { id: 'glow', cx: '0.5', cy: '0', r: '0.7' });
  glow.append(
    el('stop', { offset: '0%',   'stop-color': '#5a5a70', 'stop-opacity': '0.22' }),
    el('stop', { offset: '100%', 'stop-color': '#000',     'stop-opacity': '0' })
  );
  defs.append(glow);

  svgEl.append(defs);

  const WALL_H = 55;
  const TIER_H = 65;
  const wallTopY  = H - WALL_H;
  const frontTopY = wallTopY - TIER_H;
  const midTopY   = frontTopY - TIER_H;
  const rearTopY  = midTopY - TIER_H;

  const I0 = 0, I1 = 30, I2 = 60, I3 = 90;

  /* Небо */
  svgEl.append(el('rect', { x: 0, y: 0, width: W, height: H, fill: 'url(#skyGrad)' }));
  svgEl.append(el('rect', { x: 0, y: 0, width: W, height: H * 0.4, fill: 'url(#glow)' }));
  svgEl.append(el('rect', { x: 0, y: H * 0.42 - 80, width: W, height: 18, fill: PALETTE.tierRear[0], opacity: 0.7 }));
  // Поднятый слой городского фона перекрывает ночное небо.
  svgEl.append(el('rect', { x:0, y:0, width:W, height:H * 0.42 - 80, fill:PALETTE.tierRear[1], opacity:0.92 }));
  svgEl.append(el('rect', { x:0, y:H * 0.42 - 80, width:W, height:18, fill:PALETTE.tierRear[1], opacity:0.9 }));
  const skyline = el('g', { fill:PALETTE.tierRear[0], opacity:0.9 });
  // Три отдельные группы на адаптивных позициях, ниже облаков.
  for (const center of [W * 0.16, W * 0.5, W * 0.84]) {
    for (const [offset, height, width] of [[-45,24,26],[-12,40,22],[17,28,28]]) {
      const x = center + offset;
      const base = rearTopY - 8;
      skyline.append(el('rect', {x, y:base-height, width, height}));
      for (let wy=base-height+7; wy<base-4; wy+=9) {
        skyline.append(el('rect', {x:x+5, y:wy, width:3, height:3, fill:PALETTE.wallTop, opacity:0.6}));
      }
    }
  }
  svgEl.append(skyline);
  const cloud = el('g', { class:'cloud-pixel', fill: PALETTE.wallTop, opacity: 0.22 });
  for (const cx of [W*0.18, W*0.72]) {
    cloud.append(el('rect', { x:cx-42, y:38, width:84, height:8 }));
    cloud.append(el('rect', { x:cx-26, y:30, width:52, height:8 }));
    cloud.append(el('rect', { x:cx-12, y:24, width:24, height:6 }));
  }
  svgEl.append(cloud);

  /* Флаги — мачты доходят до верхнего яруса */
  const flagGroup = el('g');
  for (const fx of [W * 0.12, W * 0.88]) {
    flagGroup.append(el('line', {
      x1: fx, y1: 105, x2: fx, y2: rearTopY,     // мачта стоит на трибуне
      stroke: PALETTE.flagPole, 'stroke-width': 1
    }));
    flagGroup.append(el('polygon', { class:'flag-pixel',
      points: `${fx},107 ${fx + 30},113 ${fx},119`,
      fill: PALETTE.flag
    }));
  }
  svgEl.append(flagGroup);

  /* Ярусы */
  svgEl.append(el('polygon', {
    points: `${I3},${rearTopY} ${W - I3},${rearTopY} ${W - I2},${midTopY} ${I2},${midTopY}`,
    fill: 'url(#tierRear)'
  }));
  svgEl.append(el('polygon', {
    points: `${I2},${midTopY} ${W - I2},${midTopY} ${W - I1},${frontTopY} ${I1},${frontTopY}`,
    fill: 'url(#tierMid)'
  }));
  svgEl.append(el('polygon', {
    points: `${I1},${frontTopY} ${W - I1},${frontTopY} ${W - I0},${wallTopY} ${I0},${wallTopY}`,
    fill: 'url(#tierFront)'
  }));

  svgEl.append(el('line', {
    x1: I1, y1: frontTopY, x2: W - I1, y2: frontTopY,
    stroke: 'rgba(255,255,255,0.07)', 'stroke-width': 1
  }));
  svgEl.append(el('line', {
    x1: I2, y1: midTopY, x2: W - I2, y2: midTopY,
    stroke: 'rgba(255,255,255,0.05)', 'stroke-width': 1
  }));

  /* Сиденья */
  const totalW = CONFIG.cols * CONFIG.slotWidth;
  const seatStartX = (W - totalW) / 2;
  const seatColors = [PALETTE.seatFront, PALETTE.seatMid, PALETTE.seatRear];

  for (let r = 0; r < CONFIG.rows; r++) {
    const shift = (r % 2 === 0) ? 0 : CONFIG.slotWidth / 2;
    const seatW = CONFIG.slotWidth * 0.5;
    const seatH = 8;
    const seatY = H - CONFIG.rowYs[r] - seatH + 3;

    for (let c = 0; c < CONFIG.cols; c++) {
      const seatX = seatStartX + c * CONFIG.slotWidth + shift + (CONFIG.slotWidth - seatW) / 2;
      svgEl.append(el('rect', {
        x: seatX, y: seatY, width: seatW, height: seatH, rx: 2,
        fill: seatColors[r], stroke: PALETTE.seatStroke,
        'stroke-width': 1, opacity: 0.85
      }));
    }
  }

  /* Передняя стенка */
  svgEl.append(el('rect', {
    x: 0, y: wallTopY, width: W, height: WALL_H, fill: 'url(#wallGrad)'
  }));
  svgEl.append(el('rect', {
    x: 0, y: wallTopY, width: W, height: 3, fill: PALETTE.wallTop
  }));

  /* Нижняя лента с двумя пиксельными соцсетями */
  const bbY = wallTopY + 10, bbH = WALL_H - 18, gap = 18;
  const panelW = (W - 40 - gap) / 2;
  for (let i=0; i<2; i++) {
    const bx = 20 + i * (panelW + gap);
    svgEl.append(el('rect',{x:bx,y:bbY,width:panelW,height:bbH,fill:PALETTE.billboard,stroke:PALETTE.billboardStroke,'stroke-width':2,rx:2}));
    const cx=bx+20, cy=bbY+bbH/2;
    svgEl.append(el('circle',{cx,cy,r:7,fill:i===0?'#39aee1':'#7547c7'}));
    if (i===0) svgEl.append(el('polygon',{points:`${cx-4},${cy} ${cx+4},${cy-4} ${cx+2},${cy+5}`,fill:'#fff'}));
    else {
      svgEl.append(el('rect',{x:cx-4,y:cy-4,width:8,height:8,fill:'#fff'}));
      svgEl.append(el('rect',{x:cx-2,y:cy-2,width:1.5,height:3,fill:'#7547c7'}));
      svgEl.append(el('rect',{x:cx+1,y:cy-2,width:1.5,height:3,fill:'#7547c7'}));
    }
    const text=el('text',{x:bx+panelW/2+12,y:bbY+bbH/2+4,'font-family':'Courier New, monospace','font-size':Math.min(14,bbH*.64),fill:PALETTE.billboardText,'text-anchor':'middle','font-weight':'700','paint-order':'stroke','stroke':PALETTE.billboardStroke,'stroke-width':0.7});
    text.textContent='NONSTAZY'; svgEl.append(text);
  }
}

/* ============== ПЕРЕСБОРКА ============== */
function rebuildAll() {
  computeSlots();
  drawStadium();
  const nicks = [...persons.keys()];
  for (const nick of nicks) {
    const p = persons.get(nick);
    if (p) p.el.remove();
  }
  persons.clear();
  for (const nick of nicks) createPerson(nick);
}
applyEnvironmentTheme('night');
rebuildAll();
window.addEventListener('resize', rebuildAll);

/* ---- Утилиты ---- */
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function hashHue(nick) {
  let h = 0;
  for (let i = 0; i < nick.length; i++) h = (h * 31 + nick.charCodeAt(i)) | 0;
  return Math.abs(h) % 360;
}
function log(msg) {
  if (!DEV) return;
  const t = new Date().toLocaleTimeString();
  devLogEl.textContent = `[${t}] ${msg}\n` + devLogEl.textContent;
  if (devLogEl.textContent.length > 4000) devLogEl.textContent = devLogEl.textContent.slice(0, 4000);
}
function updateStats() {
  if (!DEV) return;
  const taken = slots.filter(s => s.taken).length;
  devStatsEl.textContent = `Зрителей: ${persons.size} / Мест: ${taken}/${slots.length} / TTL: ${CONFIG.ttl/1000}с`;
}

/* ---- Слот ---- */
function takeSlot(nick) {
  const freeSlots = slots.filter(s => !s.taken);
  const free = freeSlots[Math.floor(Math.random() * freeSlots.length)];
  if (!free) return null;
  free.taken = nick;
  return free;
}
function freeSlot(nick) {
  const s = slots.find(s => s.taken === nick);
  if (s) s.taken = null;
}

/* ---- Создание человечка ---- */
function createPerson(nick) {
  if (persons.has(nick)) return persons.get(nick);
  if (persons.size >= CONFIG.maxPersons) return null;
  const slot = takeSlot(nick);
  if (!slot) return null;

  const el = document.createElement('div');
  el.className = 'person entering walking';
  const hue = hashHue(nick);
  el.style.setProperty('--c', `hsl(${hue}, 70%, 60%)`);
  const skin = ['#f0b38a', '#c9825b', '#8f5539', '#f3c7a0'][Math.floor(Math.random() * 4)];
  const shirt = ['#e85d5d', '#4f83d1', '#55b879', '#d49a3a', '#a66bd1'][Math.floor(Math.random() * 5)];
  el.style.setProperty('--skin', skin);
  el.style.setProperty('--shirt', shirt);
  el.style.setProperty('--pants', ['#27324a', '#3d2e36', '#252b2b'][Math.floor(Math.random() * 3)]);
  el.style.setProperty('--shoe', '#17191f');
  el.style.setProperty('--sway-delay', (Math.random() * 2).toFixed(2) + 's');
  el.innerHTML = `
    <div class="person-bounce">
      <div class="person-inner">
        <div class="head"><span class="eye-left"></span><span class="eye-right"></span><span class="mouth"></span><span class="ear-left"></span><span class="ear-right"></span></div>
        <div class="body"></div>
        <div class="arm-left"><span class="hand-left"></span></div>
        <div class="arm-right"><span class="hand-right"></span></div>
        <div class="pants"></div>
        <div class="leg-left"></div>
        <div class="leg-right"></div>
        <div class="foot-left"></div>
        <div class="foot-right"></div>
        <div class="nick">${escapeHtml(nick)}</div>
        <div class="msg"></div>
      </div>
    </div>
  `;
  el.style.left = slot.x + 'px';
  el.style.bottom = slot.y + 'px';
  stageEl.appendChild(el);

  const obj = {
    el,
    msgEl: el.querySelector('.msg'),
    bounceEl: el.querySelector('.person-bounce'),
    slot,
    lastActivity: Date.now(),
    queue: [],
    showing: false,
    msgTimer: null,
    lastShownAt: 0,
    dying: false,
    celebrating: false
  };
  persons.set(nick, obj);

  requestAnimationFrame(() => {
    el.classList.add('alive');
    setTimeout(() => {
      el.classList.remove('entering');
      setTimeout(() => {
        el.classList.remove('walking');
        obj.bounceEl.classList.add('jumping');
        setTimeout(() => obj.bounceEl.classList.remove('jumping'), 800);
      }, 1850);
    }, 40);
  });

  log(`+ ${nick} (hue ${hue}) ряд ${slot.row}, кол. ${slot.col}`);
  updateStats();
  return obj;
}

/* ---- Удаление ---- */
function removePerson(nick) {
  const p = persons.get(nick);
  if (!p || p.dying) return;
  p.dying = true;
  p.el.classList.remove('alive', 'walking');
  p.el.classList.add('dying');
  setTimeout(() => {
    p.el.remove();
    persons.delete(nick);
    freeSlot(nick);
    updateStats();
  }, CONFIG.fadeOut);
  log(`- ${nick} ушёл`);
}

/* ---- Празднование ---- */
function triggerCelebrate(nick) {
  const p = persons.get(nick);
  if (!p || p.dying) return;
  if (p.celebrating) return;
  p.celebrating = true;
  p.bounceEl.classList.add('celebrating');
  setTimeout(() => {
    p.bounceEl.classList.remove('celebrating');
    p.celebrating = false;
  }, 1800);
  log(`🎉 ${nick} празднует!`);
}

/* ---- Конфети ---- */
function spawnConfetti(count = 80) {
  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = `hsl(${Math.random()*360}, 80%, 60%)`;
    piece.style.animationDelay = (Math.random() * 0.6).toFixed(2) + 's';
    piece.style.animationDuration = (1.8 + Math.random() * 1.6).toFixed(2) + 's';
    confettiLayer.appendChild(piece);
    setTimeout(() => piece.remove(), 4000);
  }
  log('🎊 Конфети!');
}

/* ---- Очередь сообщений ---- */
function pumpQueue(nick) {
  const p = persons.get(nick);
  if (!p || p.dying) return;
  if (p.showing || p.queue.length === 0) return;

  const now = Date.now();
  const since = now - p.lastShownAt;
  const wait = Math.max(0, CONFIG.antispamMs - since);

  setTimeout(() => {
    const p2 = persons.get(nick);
    if (!p2 || p2.dying) return;
    if (p2.showing || p2.queue.length === 0) return;
    if (p2.lastShownAt && Date.now() - p2.lastShownAt < CONFIG.antispamMs) {
      pumpQueue(nick);
      return;
    }

    const text = p2.queue.shift();
    p2.showing = true;
    p2.lastShownAt = Date.now();
    p2.msgEl.textContent = text;
    p2.msgEl.classList.add('show');
    log(`💬 ${nick}: ${text}`);

    clearTimeout(p2.msgTimer);
    p2.msgTimer = setTimeout(() => {
      const p3 = persons.get(nick);
      if (!p3) return;
      p3.msgEl.classList.remove('show');
      p3.showing = false;
      pumpQueue(nick);
    }, CONFIG.msgDuration);
  }, wait);
}

function enqueueMessage(nick, text) {
  const p = persons.get(nick);
  if (!p || p.dying) return;
  p.lastActivity = Date.now();
  if (p.queue.length >= CONFIG.queueMax) p.queue.shift();
  p.queue.push(text);
  pumpQueue(nick);
}

function enqueueBoardMessage(nick, message) {
  boardQueue.push({ nick, message });
  if (boardQueue.length > 20) boardQueue.shift();
  pumpBoard();
}
function pumpBoard() {
  if (boardBusy || boardQueue.length === 0) return;
  boardBusy = true;
  const item = boardQueue.shift();
  boardNickEl.textContent = item.nick;
  boardTextEl.textContent = item.message;
  boardTextEl.classList.remove('scrolling');
  boardTextEl.style.setProperty('--ticker-distance', '0px');
  requestAnimationFrame(() => {
    const viewport = document.getElementById('boardViewport');
    const distance = Math.max(0, boardTextEl.scrollWidth - viewport.clientWidth + 12);
    if (distance > 0) {
      boardTextEl.style.setProperty('--ticker-distance', `-${distance}px`);
      boardTextEl.classList.add('scrolling');
    }
  });
  setTimeout(() => { boardBusy = false; pumpBoard(); }, Math.max(4500, Math.min(10000, 3000 + item.message.length * 90)));
}

/* ================= ЕДИНАЯ ТОЧКА ОБРАБОТКИ ================= */
function handleMessage({ nick, message }) {
  if (!nick || !message) return;

  const lower = message.toLowerCase();
  const isKeyword = lower.includes(CONFIG.keyword.toLowerCase());
  const isCelebrate = CONFIG.celebrateWords.some(w => lower.includes(w));

  if (persons.has(nick)) {
    enqueueMessage(nick, message);
    enqueueBoardMessage(nick, message);
    if (isCelebrate) triggerCelebrate(nick);
  } else if (isKeyword) {
    createPerson(nick);
  }
}

/* ================== TTL ================== */
setInterval(() => {
  const now = Date.now();
  for (const [nick, p] of persons) {
    if (p.dying) continue;
    const idle = (now - p.lastActivity) / timeScale;
    if (idle > CONFIG.ttl) removePerson(nick);
  }
}, 1000);

/* ================== TWITCH IRC ================== */
function connect() {
  const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

  ws.onopen = () => {
    log('WS: подключено');
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan' + Math.floor(Math.random() * 99999));
    ws.send('JOIN #' + CONFIG.channel.toLowerCase());
  };

  ws.onmessage = (event) => {
    for (const line of event.data.split('\r\n')) {
      if (!line) continue;
      if (line.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); continue; }

      // PRIVMSG
      const match = line.match(/^@([^ ]+) :(\w+)!\S+ PRIVMSG #\S+ :(.*)$/);
      if (match) {
        const tags = Object.fromEntries(match[1].split(';').map(kv => kv.split('=')));
        const nick = tags['display-name'] || match[2];
        const message = match[3];
        handleMessage({ nick, message, tags });
        continue;
      }

      // USERNOTICE (follow, sub, raid и т.д.)
      const noticeMatch = line.match(/^@([^ ]+) :tmi\.twitch\.tv USERNOTICE #(\w+)/);
      if (noticeMatch) {
        const tags = Object.fromEntries(noticeMatch[1].split(';').map(kv => kv.split('=')));
        const msgId = tags['msg-id'];
        log(`USERNOTICE: ${msgId}`);
        if (msgId === 'follow') {
          spawnConfetti(100);
        }
      }
    }
  };

  ws.onclose = () => {
    log('WS: разрыв, переподключение…');
    setTimeout(connect, 3000);
  };
}
connect();

function devConfetti() { spawnConfetti(120); }
function devToggleTime() {
  timeScale = timeScale === 1 ? 10 : 1;
  devTimeEl.textContent = '×' + timeScale;
}
function devTheme(name) {
  document.body.classList.remove('theme-retro', 'theme-night');
  if (name === 'retro') document.body.classList.add('theme-retro');
  if (name === 'night') document.body.classList.add('theme-night');
  log(`Тема: ${name}`);
}
function devClear() {
  for (const nick of [...persons.keys()]) removePerson(nick);
}

if (DEV) {
  setInterval(() => {
    if (Math.random() < 0.3) devAddPerson();
    if (Math.random() < 0.5) devSpam();
    if (Math.random() < 0.1) devCelebrate();
  }, 4000);
  updateStats();
}
